# DESARROLLO / pruebas locales:  docker compose up -d --build        -> http://localhost:8000
# PRODUCCIÓN (HTTPS + copias):    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build   (ver SECURITY.md)
x-app: &app
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  networks: [data, web]
  depends_on: [seaweed, mongo, postgres]
services:
  frontend:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8000:80"]        # solo accesible desde este equipo; en producción lo publica Caddy con HTTPS
    volumes: ["./frontend:/usr/share/nginx/html:ro", "./nginx.conf:/etc/nginx/conf.d/default.conf:ro", "./nginx:/etc/nginx/snippets:ro"]
    depends_on: [auth, chat, survey, games]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [web]
  seaweed:      # datalake S3 local (SeaweedFS, licencia Apache-2.0). En la nube se usa Cloudflare R2 y este contenedor no se necesita
    image: chrislusf/seaweedfs:latest
    entrypoint: ["/bin/sh", "-c"]
    # genera la configuración S3 con las credenciales del .env y arranca master+volumen+filer+S3 en un solo proceso
    command:
      - |
        printf '{"identities":[{"name":"serenia","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_KEY" "$$S3_SECRET" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=256 -ip.bind=0.0.0.0
    environment: {S3_KEY: "${S3_KEY}", S3_SECRET: "${S3_SECRET}"}
    ports: ["127.0.0.1:8333:8333"]     # solo desde este equipo
    volumes: [lake:/data]
    restart: unless-stopped
    networks: [data]
  mongo:
    image: mongo:7
    # Con MONGO_ROOT_USER y MONGO_ROOT_PASS Mongo exige usuario y contraseña (solo se aplica al crear el volumen por primera vez: ver SECURITY.md)
    environment: {MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER:-}", MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASS:-}"}
    volumes: [mongo:/data/db]
    restart: unless-stopped
    networks: [data]
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: serenia, POSTGRES_PASSWORD: "${PG_PASS}", POSTGRES_DB: serenia}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U serenia -d serenia"], interval: 5s, retries: 20}
    restart: unless-stopped
    networks: [data]
  auth:
    <<: *app
    build: {context: ., dockerfile: Dockerfile.service, args: {SVC: auth}}
    env_file: .env
  chat:
    <<: *app
    build: {context: ., dockerfile: Dockerfile.service, args: {SVC: chat}}
    env_file: [.env, .env.chat]
  survey:
    <<: *app
    build: {context: ., dockerfile: Dockerfile.service, args: {SVC: survey}}
    env_file: .env
  games:
    <<: *app
    build: {context: ., dockerfile: Dockerfile.service, args: {SVC: games}}
    env_file: .env
  etl:
    <<: *app
    build: {context: ., dockerfile: Dockerfile.service, args: {SVC: etl}}
    env_file: [.env, .env.etl]
    command: python etl.py
  backup:
    <<: *app
    build: {context: ., dockerfile: Dockerfile.service, args: {SVC: backup}}
    env_file: .env
    environment: {BACKUP_DIR: /backups, TMPDIR: /backups/tmp}
    command: python backup.py
    volumes: [backups:/backups]
  seed:
    build: {context: ., dockerfile: Dockerfile.service, args: {SVC: seed}}
    env_file: .env
    command: python seed.py
    depends_on: [seaweed, postgres]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [data]
networks:
  data: {internal: true}     # bases de datos y datalake: sin salida a internet ni acceso desde fuera
  web: {}
volumes: {lake: {}, mongo: {}, pgdata: {}, backups: {}, caddy_data: {}, caddy_config: {}}
