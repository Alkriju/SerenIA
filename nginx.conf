# nginx interno: sirve la web y reparte /api/* a los servicios. En producción va DETRÁS de Caddy (que pone el HTTPS).
server_tokens off;
# La IP real del visitante la pone Caddy en X-Forwarded-For; solo se confía en los rangos privados de Docker.
set_real_ip_from 10.0.0.0/8; set_real_ip_from 172.16.0.0/12; set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For; real_ip_recursive on;
limit_req_zone $binary_remote_addr zone=auth:10m rate=6r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429; limit_conn_status 429;

server {
  listen 80;
  root /usr/share/nginx/html; index index.html;
  resolver 127.0.0.11 valid=5s ipv6=off;        # DNS interno de Docker: vuelve a resolver los servicios si se recrean (evita el 502 por IP vieja)
  client_max_body_size 64k; client_body_timeout 15s; client_header_timeout 15s; keepalive_timeout 30s; send_timeout 30s;
  limit_conn perip 40;

  # Cabeceras de seguridad (HSTS lo añade Caddy, porque solo tiene sentido sobre HTTPS)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

  location ~ /\.            { deny all; return 404; }                  # nada de archivos ocultos (.env, .git…)
  location ~* \.(py|env|md|map|bak|sql|yml|yaml)$ { return 404; }
  location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/sec.conf; }
  location /fonts/ { expires 30d; add_header Cache-Control "public, immutable" always; include /etc/nginx/snippets/sec.conf; }

  location /api/auth/ {
    limit_req zone=auth burst=12 nodelay;
    set $up http://auth:8000; rewrite ^/api/auth/(.*)$ /$1 break; proxy_pass $up; include /etc/nginx/snippets/proxy.conf;
  }
  location /api/chat/ {
    limit_req zone=api burst=40 nodelay; client_max_body_size 8m; proxy_read_timeout 120s;
    set $up http://chat:8000; rewrite ^/api/chat/(.*)$ /$1 break; proxy_pass $up; include /etc/nginx/snippets/proxy.conf;
  }
  location /api/survey/ {
    limit_req zone=api burst=40 nodelay;
    set $up http://survey:8000; rewrite ^/api/survey/(.*)$ /$1 break; proxy_pass $up; include /etc/nginx/snippets/proxy.conf;
  }
  location /api/games/ {
    limit_req zone=api burst=40 nodelay;
    set $up http://games:8000; rewrite ^/api/games/(.*)$ /$1 break; proxy_pass $up; include /etc/nginx/snippets/proxy.conf;
  }
  location /api/ { return 404; }
}
